chain:
  name: ethereum
  chain_id: 1
  rpc_read:
    - https://ethereum-rpc.publicnode.com
    - https://eth.llamarpc.com
    - https://cloudflare-eth.com
  rpc_send:
    - https://ethereum-rpc.publicnode.com
  rpc_private:
    - https://rpc.flashbots.net
    - https://rpc.mevblocker.io
  ws:
    - wss://ethereum-rpc.publicnode.com
  weth: '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
  univ3_quoter_v2: '0x61fFE014bA17989E743c5F6cB21bF9697530B21e'
  univ3_factory: '0x1F98431c8aD98523631AE4a59f267346ea31F984'
  univ3_swap_router: '0xE592427A0AEce92De3Edee1F18E0157C05861564'
  aave_v3_pool: '0x87870Bca3F3fD6335C3F4ce8392D69350B4fA4E2'
  balancer_vault: '0xba12222222228d8ba445958a75a0704d566bf2c8'
  token_universe:
    - '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
    - '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
    - '0xdAC17F958D2ee523a2206206994597C13D831ec7'
    - '0x6B175474E89094C44Da98b954EedeAC495271d0F'
  discovery_interval_blocks: 25
  discovery_max_calls: 32
  v3_pairs: []
  curve_pools: []
  balancer_pools: []

safety:
  minProfitAbs: '0'
  minProfitBps: 18
  slippage_bps: 30
  max_borrow_amount: '0'
  require_estimate_gas: true
  require_simulation: true

flags:
  enable_two_leg_loops: true
  enable_curve_autogen: true
  enable_balancer_autogen: true
  enable_three_leg_loops: true
  enable_v3_triangular: true
  enable_discovery: true

execution:
  # SAFETY FIRST:
  # - leave dry_run true + auto_trading false until governance + infra is verified.
  dry_run: true
  auto_trading: false

  # core trade config
  base_borrow_amount: '25000000000000000' # 0.025 WETH
  send_mode: protected_rpc
  gas_mode: fast
  gas_limit: 600000
  max_submit_per_block: 1
  max_pending_txs: 1
  deadline_seconds: 20
  redact_routes_when_private: true

  # execution / wallet
  private_key_env: VICTOR_PRIVATE_KEY
  from_address: ''
  executor_address: ''
  profit_to: ''

  # risk & learning overlays
  brain_mode: auto
  min_p_success: 0.80

  # bankroll sizing (Kelly)
  kelly_enabled: true
  kelly_window: 60
  kelly_cap_fraction: 0.22
  kelly_min_fraction: 0.02
  volatility_downscale: 0.35

  # BehaveAgent: regime-aware prioritization + transparent reasoning
  behaveagent:
    enabled: true
    unknown_regime_fallback: conservative
    transparency_min_score: 0.55
    exploration_capital_fraction: 0.10

  # Treasury: profit targeting + aggressiveness tuning
  treasury:
    enabled: true
    goal:
      target_return_percentage: 8.0
      time_horizon_seconds: 604800
      risk_tolerance: aggressive
      max_drawdown_pct: 12.0
      capital_commitment_pct: 35.0
      priority_weight: 1.0
    enable_yield_deployment: true
    liquidity_min_buffer_pct: 25.0
    aggressiveness_max_borrow_mult: 3.0

  # Consensus: multi-agent signal gating
  consensus:
    enabled: true
    base_threshold: 0.06
    stress_threshold_mult: 1.25
    conflict_penalty: 0.25
    enforce_on_auto: true
    enforce_on_manual: false

  # Spread engine (observation + alpha bus)
  spread:
    enabled: true
    min_alpha: 0.08
    default_volume_usd: 12000.0

  # Governance: intent + security stack
  governance:
    enabled: true
    enforce_on_auto: true
    enforce_on_manual: true
    require_human_for_tier5: true
    require_human_for_maximum_aggressiveness: true

  # gas presets
  gas_presets:
    standard_max_fee_gwei: 30
    standard_priority_fee_gwei: 2
    fast_max_fee_gwei: 55
    fast_priority_fee_gwei: 4
    instant_max_fee_gwei: 90
    instant_priority_fee_gwei: 6

  daily_gas_budget_wei: '0'

__strategy__:
  name: ultra_profit_mode
  tier: advanced
  description: Aggressive, regime-aware scoring + kelly sizing + treasury profit goals, still dry-run by default.
