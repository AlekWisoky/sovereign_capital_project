chain:
  name: optimism
  chain_id: 10
  rpc_read:
  - https://optimism-rpc.publicnode.com
  - https://mainnet.optimism.io
  - https://op.api.pocket.network
  rpc_send:
  - https://optimism-rpc.publicnode.com
  - https://op.api.pocket.network
  ws: []
  weth: ''
  univ3_quoter_v2: ''
  univ3_factory: ''
  univ3_swap_router: ''
  aave_v3_pool: ''
  balancer_vault: ''
  token_universe: []
  discovery_interval_blocks: 80
  discovery_max_calls: 16
  rpc_private: []
safety:
  minProfitAbs: '0'
  minProfitBps: 0
  slippage_bps: 50
  max_borrow_amount: '0'
  require_estimate_gas: true
  require_simulation: false
execution:
  dry_run: true
  auto_trading: false
  send_mode: public
  gas_mode: standard
  gas_limit: 550000
  private_key_env: VICTOR_PRIVATE_KEY
  from_address: ''
  executor_address: ''
  profit_to: ''
  withdraw_mode: txdata
  withdraw_allowlist: []
  withdraw_tokens: []
  flash_provider: aave
  flashloan_fee_bps: 9
flags:
  enable_two_leg_loops: true
  enable_curve_autogen: false
  enable_balancer_autogen: false
  enable_three_leg_loops: false
  enable_v3_triangular: false
  enable_discovery: false
