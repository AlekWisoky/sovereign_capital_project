name: OMAR test helper

on:
  push:
    branches:
      - omar/phase-6-runtime-method-chain

jobs:
  omar-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend pytest -q backend/tests/test_omar_canonical_propagation.py
