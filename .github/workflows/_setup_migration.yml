name: surgical-setup-migration
on:
  push:
    branches: [mobile/guarded-mutations]
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/mobile/guarded-mutations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/guarded-mutations
          fetch-depth: 1
      - name: Apply guarded Setup boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/src/screens/v2/SetupScreen.tsx')
          s = p.read_text()
          s = s.replace("import React, { useEffect, useMemo, useState } from 'react';\nimport { View, Text, TextInput, Pressable, ScrollView, Switch } from 'react-native';", "import React, { useEffect, useMemo, useState } from 'react';\nimport { Alert, View, Text, TextInput, Pressable, ScrollView, Switch } from 'react-native';", 1)
          old = "import { health, deployInfo, rpcPreferences, saveRpcPreferences, launchState, setLaunchMode, listPresets, applyPreset } from '../../api/client';"
          new = "import { health, deployInfo, rpcPreferences, launchState, listPresets } from '../../api/client';\nimport { guardedSaveRpcPreferences, guardedSetLaunchMode, guardedApplyPreset, guardedSelectChain } from '../../api/guardedMutations';\nimport { guardMutation, type MutationGuardContext } from '../../api/mutationGuard';"
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace("const { state, set, multichain, refreshMultichain, selectActiveChain } = useStore();", "const { state, set, multichain, refreshMultichain } = useStore();", 1)
          marker = "  const [status, setStatus] = useState('');"
          assert marker in s
          s = s.replace(marker, marker + "\n  const [backendReachable, setBackendReachable] = useState(false);", 1)
          old = "        setLaunchInfo(info);"
          new = "        setLaunchInfo(info);\n        setBackendReachable(true);"
          assert old in s
          s = s.replace(old, new, 1)
          old = "      } catch {\n        if (!alive) return;\n        setLaunchInfo(null);"
          new = "      } catch {\n        if (!alive) return;\n        setBackendReachable(false);\n        setLaunchInfo(null);"
          assert old in s
          s = s.replace(old, new, 1)
          start = "  async function save() {"
          assert start in s
          end = "\n  return (\n"
          i = s.index(start)
          j = s.index(end, i)
          oldsave = s[i:j]
          newsave = r'''  function confirmMutation(title: string, message: string): Promise<boolean> {
    return new Promise((resolve) => {
      let settled = false;
      const finish = (value: boolean) => {
        if (settled) return;
        settled = true;
        resolve(value);
      };
      Alert.alert(
        title,
        message,
        [
          { text: 'Cancel', style: 'cancel', onPress: () => finish(false) },
          { text: 'Confirm', style: 'destructive', onPress: () => finish(true) },
        ],
        { cancelable: true, onDismiss: () => finish(false) },
      );
    });
  }

  function mutationContext(explicitConfirmation: boolean): MutationGuardContext {
    return {
      role: isOperator ? 'operator' : 'read_only',
      locked: false,
      adminKeyPresent: Boolean(adminKey.trim()),
      backendReachable,
      // Live authority remains closed until Issue #89.
      backendLiveAuthority: false,
      explicitConfirmation,
    };
  }

  async function save() {
    const url = safeBaseUrl;
    const key = adminKey.trim();
    const backendUrls = [url, ...(state.backendUrls ?? [])].map((x) => String(x || '').trim()).filter(Boolean).filter((x, i, arr) => arr.indexOf(x) === i).slice(0, 8);
    const readUrls = parseList(premiumRead).slice(0, 8);
    const sendUrls = parseList(premiumSend).slice(0, 8);
    const privateUrls = parseList(premiumPrivate).slice(0, 8);
    const walletAddresses = parseList(walletAddressesText).slice(0, 12);
    set({
      onboarded: true,
      baseUrl: url,
      backendUrls,
      premiumRpcReadUrls: readUrls,
      premiumRpcSendUrls: sendUrls,
      premiumRpcPrivateUrls: privateUrls,
      preferredLaunchMode: launchModeLocal,
      adminKey: isOperator ? key : '',
      hasAdminKeySecure: isOperator ? Boolean(key) : false,
      role,
      themeName,
      biometricsEnabled,
      chain,
      activeChain: chain,
      preset,
      autoTrading,
      gasMode,
      sendMode,
      autoReinvestEnabled,
      reinvestRate: Number(reinvestRate) || 0,
      minProfitAbs,
      minProfitBps: Number(minProfitBps) || 0,
      slippageBps: Number(slippageBps) || 0,
      requireSimulation,
      antiFrontrun,
      brainMode,
      walletAddresses,
      defaultWithdrawalDest,
      unitTokenAddress,
      baseBorrowAmount,
      maxBorrowAmount,
      ccDataSource,
      ccRefreshMs: Math.max(1500, Number(ccRefreshMs) || 4500),
    });
    setStatus('Saved locally. Synchronizing backend…');

    if (!(isOperator && key && url && backendReachable)) {
      if (isOperator && key && url && !backendReachable) {
        setStatus('Saved locally · backend unavailable; backend synchronization skipped.');
      } else {
        setStatus('Saved.');
      }
      return;
    }

    const operations = [
      'active chain',
      'RPC preferences',
      'launch mode',
      ...(preset ? ['preset'] : []),
    ];
    const confirmations = operations.join(', ');
    const checks = [
      guardMutation('chain_control', mutationContext(false)),
      guardMutation('settings', mutationContext(false)),
      guardMutation('launch_control', mutationContext(false)),
    ];
    if (preset) checks.push(guardMutation('launch_control', mutationContext(false)));
    if (checks.some((result) => !result.allowed && result.reasonCode !== 'explicit_confirmation_required')) {
      setStatus('Saved locally · backend mutation guard denied synchronization.');
      return;
    }
    const confirmed = await confirmMutation(
      'Confirm backend synchronization',
      `Apply ${confirmations} to the configured backend?\n\nThis does not activate live trading authority; live authority remains disabled until Issue #89.`,
    );
    if (!confirmed) {
      setStatus('Saved locally · backend synchronization cancelled.');
      return;
    }

    const context = mutationContext(true);
    try {
      guardMutation('chain_control', context);
      await guardedSelectChain(url, chain, key, context);
      await guardedSaveRpcPreferences(url, { read: readUrls, send: sendUrls, private: privateUrls }, key, context);
      await guardedSetLaunchMode(url, launchModeLocal, key, context);
      if (preset) await guardedApplyPreset(url, chain, preset, key, context);
      setStatus('Saved and synchronized.');
    } catch (e: unknown) {
      setStatus(e instanceof Error ? `Saved locally · backend sync pending · ${e.message}` : `Saved locally · backend sync pending · ${String(e)}`);
    }
  }
'''
          s = s[:i] + newsave + s[j:]
          p.write_text(s)
          PY
      - name: Commit migration and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/_setup_migration.yml
          git add mobile/src/screens/v2/SetupScreen.tsx .github/workflows/_setup_migration.yml
          git diff --cached --check
          git diff --cached -- mobile/src/screens/v2/SetupScreen.tsx
          git commit -m 'fix(mobile): route Setup mutations through guard'
          git push origin mobile/guarded-mutations
