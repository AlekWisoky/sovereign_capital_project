name: targeted-withdraw-fix

on:
  push:
    branches:
      - codex/phase-22-blackfix-run7

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-22-blackfix-run7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply targeted typing repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          s = p.read_text()
          old = '''        chain = str(\n            getattr(getattr(runtime, "cfg", None), "chain", None).name\n            if getattr(getattr(runtime, "cfg", None), "chain", None) is not None\n            else "default"\n        )'''
          new = '''        chain_cfg = getattr(getattr(runtime, "cfg", None), "chain", None)\n        chain = str(getattr(chain_cfg, "name", "default") or "default")'''
          if old not in s:
              raise SystemExit("expected chain block not found")
          s = s.replace(old, new, 1)
          marker = '        result: Dict[str, Any] = {\n            "ok": True,\n            "status": state["last_status"],\n'
          start = s.find(marker)
          if start < 0:
              raise SystemExit("expected execute result declaration not found")
          end = s.find("\n    async def ", start + 1)
          if end < 0:
              end = len(s)
          block = s[start:end]
          block = block.replace("result", "execute_result")
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          black backend/victor_ai_bot/runtime_services/withdraw_all_service.py
      - name: Commit targeted repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair withdraw service typing for linux gate"
          git push origin HEAD:codex/phase-22-blackfix-run7
