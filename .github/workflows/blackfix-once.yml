name: one-time-blackfix

on:
  push:
    branches:
      - codex/phase-22-blackfix-run7

permissions:
  contents: write

jobs:
  blackfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-22-blackfix-run7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Format backend
        run: black backend
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git diff --cached --quiet && exit 0
          git commit -m "style: format phase 22 backend with black"
          git push origin HEAD:codex/phase-22-blackfix-run7
