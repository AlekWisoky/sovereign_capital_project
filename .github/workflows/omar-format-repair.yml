name: OMAR format repair

on:
  push:
    branches:
      - omar/phase-21-production-execution-identity-verified

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Format known CI-blocking files
        run: |
          black \
            backend/victor_ai_bot/omar/config.py \
            backend/victor_ai_bot/omar/learning_identity.py \
            backend/victor_ai_bot/omar/learning_integrity.py \
            backend/victor_ai_bot/omar/learning_quality.py \
            backend/victor_ai_bot/omar/learning_quality_runtime.py \
            backend/victor_ai_bot/omar/oos_lineage_integrity.py \
            backend/victor_ai_bot/omar/performance_promotion_runtime.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/operator_intent.py \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "chore(omar): apply canonical black formatting"
          git push
