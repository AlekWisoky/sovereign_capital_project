name: OMAR format repair

on:
  push:
    branches:
      - omar/phase-7-autonomous-learning-gate-format-repair

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: pip install black==24.10.0
      - name: Format targeted OMAR gate files and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          black \
            backend/victor_ai_bot/omar/autonomous_learning_gate.py \
            backend/victor_ai_bot/omar/learning_integrity.py \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/operator_intent.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py
          git rm .github/workflows/omar-format-repair.yml
          if git diff --cached --quiet && git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/victor_ai_bot/omar/autonomous_learning_gate.py \
            backend/victor_ai_bot/omar/learning_integrity.py \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/operator_intent.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py
          git commit -m "style: format OMAR autonomous learning gate files"
          git push origin HEAD:${GITHUB_REF_NAME}
