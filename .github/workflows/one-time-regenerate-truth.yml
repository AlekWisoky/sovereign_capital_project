name: one-time-regenerate-truth

on:
  push:
    branches:
      - codex/phase-b4-raw-unit-quote-sizing

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/phase-b4-raw-unit-quote-sizing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Regenerate canonical truth
        run: |
          python scripts/render_system_truth.py
          python scripts/render_verification_report.py

      - name: Remove temporary marker and this one-time workflow
        run: |
          rm -f .tmp_placeholder_marker .regen_trigger
          rm -f .github/workflows/one-time-regenerate-truth.yml

      - name: Commit deterministic generated truth
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/system_truth.json docs/generated/system_truth.md docs/generated/verification_report.json docs/generated/verification_report.md .tmp_placeholder_marker .regen_trigger .github/workflows/one-time-regenerate-truth.yml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'docs(truth): regenerate B4 generated artifacts'
          git push origin HEAD:codex/phase-b4-raw-unit-quote-sizing
