name: One-time generated truth refresh

on:
  push:
    branches:
      - codex/phase-b-institutional-sizing-runtime-wiring

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'chore(ci): refresh generated truth') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Regenerate canonical truth artifacts
        run: |
          python scripts/render_system_truth.py
          python scripts/render_verification_report.py
      - name: Commit generated artifacts and remove one-time workflow
        run: |
          rm -f .github/workflows/one-time-refresh-generated-truth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/system_truth.json docs/generated/verification_report.json .github/workflows/one-time-refresh-generated-truth.yml
          if git diff --cached --quiet; then
            echo "Generated truth already current; nothing to commit."
            exit 0
          fi
          git commit -m "chore(ci): refresh generated truth"
          git push
