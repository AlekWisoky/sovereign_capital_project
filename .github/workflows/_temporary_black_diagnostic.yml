name: Temporary Black Diagnostic

on:
  push:
    branches:
      - omar/phase-7-canonical-execution-invariant

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: pip install black==24.10.0
      - name: Show Black diff
        run: black --diff backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py
