name: One-shot native hooks format

on:
  push:
    branches: [omar/phase-7-canonical-execution-invariant]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, 'ci: format native hooks')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black==24.10.0
      - run: black backend/victor_ai_bot/omar/native_hooks.py
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/victor_ai_bot/omar/native_hooks.py .github/workflows/one-shot-format-native-hooks.yml
          git diff --cached --check
          git commit -m 'ci: format native hooks'
          git push origin HEAD:omar/phase-7-canonical-execution-invariant
