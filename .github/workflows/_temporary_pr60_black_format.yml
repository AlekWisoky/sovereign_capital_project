name: Temporary PR60 Black Format

on:
  push:
    branches:
      - codex/omar-canonical-capital-lineage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Format PR60 Python files
        run: |
          black \
            backend/victor_ai_bot/decision_identity.py \
            backend/victor_ai_bot/identity.py \
            backend/victor_ai_bot/learning/outcome_ledger.py \
            backend/victor_ai_bot/omar/goal_evidence.py \
            backend/victor_ai_bot/omar/integration.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/operator_intent.py \
            backend/victor_ai_bot/omar/policy.py \
            backend/victor_ai_bot/omar/production_learning_hook.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/settled_ledger_bridge.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/omar/trainer.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_finalize_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_execute_wrapper_facade.py \
            backend/victor_ai_bot/runtime_services/settled_outcome_lineage.py
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/victor_ai_bot/decision_identity.py \
            backend/victor_ai_bot/identity.py \
            backend/victor_ai_bot/learning/outcome_ledger.py \
            backend/victor_ai_bot/omar/goal_evidence.py \
            backend/victor_ai_bot/omar/integration.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/operator_intent.py \
            backend/victor_ai_bot/omar/policy.py \
            backend/victor_ai_bot/omar/production_learning_hook.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/settled_ledger_bridge.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/omar/trainer.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_finalize_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_execute_wrapper_facade.py \
            backend/victor_ai_bot/runtime_services/settled_outcome_lineage.py
          if git diff --cached --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git commit -m "style: format PR60 canonical lineage files"
          git push
