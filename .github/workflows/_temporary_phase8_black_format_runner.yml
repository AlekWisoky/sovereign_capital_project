name: Temporary Phase7 Black Formatter Runner

on:
  push:
    branches:
      - omar/phase-7-human-control-contract

permissions:
  contents: write

jobs:
  format_phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: omar/phase-7-human-control-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Format Phase7 human context
        run: black backend/victor_ai_bot/runtime_services/omar_human_context.py
      - name: Commit formatting changes to Phase7 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/omar_human_context.py
          if git diff --cached --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git commit -m "style: format OMAR human context"
          git push origin HEAD:omar/phase-7-human-control-contract
