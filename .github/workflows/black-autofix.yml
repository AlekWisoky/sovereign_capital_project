name: Backend Black autofix

on:
  push:
    branches:
      - 'codex/**'
      - 'phase/**'

permissions:
  contents: write

jobs:
  black-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Black
        run: python -m pip install --disable-pip-version-check black==24.10.0

      - name: Format backend
        run: black backend

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo 'Backend already Black-formatted.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend
          git commit -m 'style: apply Black formatting to backend'
          git push
