name: One-time generated truth refresh

on:
  push:
    branches:
      - codex/phase-b4-execution-integration

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Regenerate canonical truth artifacts
        run: |
          python scripts/render_system_truth.py
          python scripts/render_verification_report.py
      - name: Commit generated truth and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/system_truth.json docs/generated/verification_report.json .github/workflows/refresh-generated-truth-once.yml
          git rm .github/workflows/refresh-generated-truth-once.yml
          if git diff --cached --quiet; then
            echo "Generated truth already fresh; no commit required."
            exit 0
          fi
          git commit -m "chore: refresh generated truth for Phase B.4"
          git push origin HEAD:codex/phase-b4-execution-integration
