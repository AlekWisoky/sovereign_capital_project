name: Temporary OMAR Calibration Repair

on:
  push:
    branches:
      - codex/black-format-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Repair OMAR calibration context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/victor_ai_bot/omar/trainer.py")
          text = p.read_text()
          needle = '''        latency = float(getattr(outcome, "latency_ms", 0.0) or 0.0)\n        context = getattr(outcome, "context", {}) or {}\n        decision_context = context.get("decisionContext") if isinstance(context, dict) else {}\n'''
          replacement = '''        latency = float(getattr(outcome, "latency_ms", 0.0) or 0.0)\n        context = getattr(outcome, "context", {}) or {}\n        brain = context.get("brain") if isinstance(context, dict) else {}\n        decision_context = context.get("decisionContext") if isinstance(context, dict) else {}\n'''
          if needle not in text:
              raise SystemExit("OMAR calibration insertion point not found")
          p.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Format backend
        run: black backend
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: restore OMAR calibration brain context"
          git push