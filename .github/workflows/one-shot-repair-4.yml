name: One-shot repair 4

on:
  push:
    branches: [omar/phase-7-canonical-execution-invariant]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'ci: repair execute-result keyword 3')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair exact keyword arguments
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/victor_ai_bot/runtime_services/withdraw_all_service.py')
          s = p.read_text(encoding='utf-8')
          before = s.count('execute_result=')
          s = s.replace('execute_result=', 'result=')
          after = s.count('execute_result=')
          print(f'repaired={before-after}')
          if before == 0 or after != 0:
              raise SystemExit('expected execute_result keyword arguments were not found')
          p.write_text(s, encoding='utf-8')
          PY
          grep -n 'execute_result=' backend/victor_ai_bot/runtime_services/withdraw_all_service.py || true
      - name: Commit and remove repair workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py .github/workflows/one-shot-repair-4.yml
          git diff --cached --check
          git commit -m 'ci: repair execute-result keyword 3'
          git push origin HEAD:omar/phase-7-canonical-execution-invariant
