name: surgical-dash-migration
on:
  push:
    branches: [mobile/guarded-mutations]
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/mobile/guarded-mutations'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/guarded-mutations
          fetch-depth: 1
      - name: Apply Dash guarded mutation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/src/screens/v2/DashScreen.tsx')
          s = p.read_text()
          old = 'import React, { useEffect, useMemo, useRef, useState } from "react";\nimport { View, Text, ScrollView, Pressable } from "react-native";'
          new = 'import React, { useEffect, useMemo, useRef, useState } from "react";\nimport { Alert, View, Text, ScrollView, Pressable } from "react-native";'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'import { adminState, pnlSummary, pnlIncome, setSettings } from "../../api/client";'
          new = 'import { adminState, pnlSummary, pnlIncome } from "../../api/client";\nimport { guardedSelectChain, guardedSetSettings } from "../../api/guardedMutations";\nimport { guardMutation, mutationKindForSettingsPatch, type MutationGuardContext } from "../../api/mutationGuard";'
          assert old in s
          s = s.replace(old, new, 1)
          old = '  const [income, setIncome] = useState<Record<string, unknown>>({});\n\n  const wsRef'
          new = '  const [income, setIncome] = useState<Record<string, unknown>>({});\n  const [backendReachable, setBackendReachable] = useState(false);\n\n  const wsRef'
          assert old in s
          s = s.replace(old, new, 1)
          old = '          const a = await adminState(state.baseUrl, state.role === "operator" ? state.adminKey : undefined);\n          if (!stop) setAdminSnap(a as Record<string, unknown>);\n        } catch {\n          // ignore'
          new = '          const a = await adminState(state.baseUrl, state.role === "operator" ? state.adminKey : undefined);\n          if (!stop) {\n            setAdminSnap(a as Record<string, unknown>);\n            setBackendReachable(true);\n          }\n        } catch {\n          if (!stop) setBackendReachable(false);\n          // ignore'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''  async function patchSettings(patch: Record<string, unknown>) {\n    if (!operatorControlsEnabled) return;\n    try {\n      await setSettings(state.baseUrl, patch, state.adminKey);\n    } catch {\n      // ignore\n    }\n  }'''
          new = '''  function confirmMutation(title: string, message: string): Promise<boolean> {\n    return new Promise((resolve) => {\n      let settled = false;\n      const finish = (value: boolean) => {\n        if (settled) return;\n        settled = true;\n        resolve(value);\n      };\n      Alert.alert(\n        title,\n        message,\n        [\n          { text: "Cancel", style: "cancel", onPress: () => finish(false) },\n          { text: "Confirm", style: "destructive", onPress: () => finish(true) },\n        ],\n        { cancelable: true, onDismiss: () => finish(false) },\n      );\n    });\n  }\n\n  function mutationContext(explicitConfirmation: boolean): MutationGuardContext {\n    return {\n      role: state.role === "operator" ? "operator" : "read_only",\n      locked: Boolean(session.locked),\n      adminKeyPresent: Boolean(state.adminKey?.trim()),\n      backendReachable,\n      // Live authority remains closed until the explicit Issue #89 activation review.\n      backendLiveAuthority: false,\n      explicitConfirmation,\n    };\n  }\n\n  async function patchSettings(patch: Record<string, unknown>, reason: string) {\n    if (!operatorControlsEnabled) return;\n    const kind = mutationKindForSettingsPatch(patch);\n    const preflight = guardMutation(kind, mutationContext(false));\n    if (!preflight.allowed && preflight.reasonCode !== "explicit_confirmation_required") return;\n    const confirmed = await confirmMutation(\n      "Confirm operator change",\n      `${reason}\\n\\nThis changes backend operator state. Confirm only if this action is intentional.`,\n    );\n    if (!confirmed) return;\n    const allowed = guardMutation(kind, mutationContext(true));\n    if (!allowed.allowed) return;\n    try {\n      await guardedSetSettings(state.baseUrl, patch, state.adminKey, mutationContext(true));\n    } catch {\n      // ignore\n    }\n  }\n\n  async function changeChain(chain: string) {\n    if (!operatorControlsEnabled) return;\n    const context = mutationContext(false);\n    const preflight = guardMutation("chain_control", context);\n    if (!preflight.allowed && preflight.reasonCode !== "explicit_confirmation_required") return;\n    const confirmed = await confirmMutation(\n      "Confirm chain change",\n      `Change the active backend chain to ${chain}?\\n\\nThis changes backend operator state. Confirm only if this action is intentional.`,\n    );\n    if (!confirmed) return;\n    const allowed = guardMutation("chain_control", mutationContext(true));\n    if (!allowed.allowed) return;\n    try {\n      await guardedSelectChain(state.baseUrl, chain, state.adminKey, mutationContext(true));\n    } catch {\n      // ignore\n    }\n  }'''
          assert old in s
          s = s.replace(old, new, 1)
          replacements = {\n            'patchSettings({ auto_trading: !Boolean(settings["auto_trading"]) })': 'patchSettings({ auto_trading: !Boolean(settings["auto_trading"]) }, "Change auto-trading mode")',\n            'patchSettings({ dry_run: !Boolean(settings["dry_run"]) })': 'patchSettings({ dry_run: !Boolean(settings["dry_run"]) }, "Change dry-run mode")',\n            'patchSettings({ send_mode: settings["send_mode"] === "flashbots" ? "public" : "flashbots" })': 'patchSettings({ send_mode: settings["send_mode"] === "flashbots" ? "public" : "flashbots" }, "Change transaction send mode")',\n            'patchSettings({ brain_mode: next })': 'patchSettings({ brain_mode: next }, "Change brain mode")',\n            'patchSettings({ gas_mode: settings["gas_mode"] === "aggressive" ? "normal" : "aggressive" })': 'patchSettings({ gas_mode: settings["gas_mode"] === "aggressive" ? "normal" : "aggressive" }, "Change gas mode")',\n            'patchSettings({ auto_trading: false })': 'patchSettings({ auto_trading: false }, "Emergency stop")',\n            'void selectActiveChain(String(c))': 'void changeChain(String(c))',\n          }\n          for a,b in replacements.items():\n            assert a in s, a\n            s = s.replace(a,b)\n          s = s.replace('  const { state, session, multichain, refreshMultichain, selectActiveChain } = useStore();', '  const { state, session, multichain, refreshMultichain } = useStore();', 1)\n          p.write_text(s)\n          PY\n      - name: Remove temporary workflow and commit\n        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/_surgical_dash_migration.yml
          git add mobile/src/screens/v2/DashScreen.tsx .github/workflows/_surgical_dash_migration.yml
          git diff --cached --check
          git diff --cached -- mobile/src/screens/v2/DashScreen.tsx
          git commit -m 'fix(mobile): route Dash mutations through guard'
          git push origin mobile/guarded-mutations
