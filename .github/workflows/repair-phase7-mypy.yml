name: Repair Phase 7 mypy

on:
  push:
    branches: [omar/phase-7-operator-intent]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'ci: repair phase7 mypy')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install formatter
        run: python -m pip install black==24.10.0
      - name: Apply targeted typing repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/victor_ai_bot/runtime_services/withdraw_all_service.py')
          s = p.read_text(encoding='utf-8')
          old_chain = '''        chain = str(\n            getattr(getattr(runtime, "cfg", None), "chain", None).name\n            if getattr(getattr(runtime, "cfg", None), "chain", None) is not None\n            else "default"\n        )'''
          new_chain = '''        chain_cfg = getattr(getattr(runtime, "cfg", None), "chain", None)\n        chain = str(getattr(chain_cfg, "name", "default") or "default")'''
          old_result = '        result: Dict[str, Any] = {\n            "ok": True,\n            "status": state["last_status"],'
          new_result = '        result = {\n            "ok": True,\n            "status": state["last_status"],'
          if old_chain not in s:
              raise SystemExit('expected chain expression not found')
          if old_result not in s:
              raise SystemExit('expected execute result declaration not found')
          s = s.replace(old_chain, new_chain, 1)
          s = s.replace(old_result, new_result, 1)
          p.write_text(s, encoding='utf-8')
          PY
          black backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          black --check backend
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git diff --cached --check
          git commit -m 'ci: repair phase7 mypy'
          git push origin HEAD:omar/phase-7-operator-intent
