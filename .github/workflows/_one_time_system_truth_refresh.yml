name: One-time system truth refresh

on:
  push:
    branches:
      - fix/runtime-facade-mro-shadowing

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: refresh generated system truth') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Generate canonical system truth
        env:
          SOURCE_DATE_EPOCH: '1789260680'
        run: python scripts/render_system_truth.py
      - name: Commit generated truth and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/system_truth.json docs/generated/system_truth.md
          git rm .github/workflows/_one_time_system_truth_refresh.yml
          git diff --cached --quiet && exit 0
          git commit -m 'chore: refresh generated system truth'
          git push origin HEAD:${GITHUB_REF_NAME}
