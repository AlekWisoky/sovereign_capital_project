name: One-off repair test inventory

on:
  push:
    branches:
      - codex/profitability-edge-objective

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align checkout to branch head
        run: |
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Repair path-based test inventory parity
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/victor_ai_bot/system_truth.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _test_inventory() -> Dict[str, Any]:
              backend_tests = sorted(
                  {
                      p.name
                      for pattern in ("test_*.py", "*_test.py")
                      for p in (BACKEND_ROOT / "tests").rglob(pattern)
                  }
              )
              mobile_tests = sorted(p.name for p in (MOBILE_ROOT / "tests").glob("*.test.ts"))
              return {
                  "backend_test_files": len(backend_tests),
                  "mobile_test_files": len(mobile_tests),
                  "backend_test_names": backend_tests,
                  "mobile_test_names": mobile_tests,
              }
          '''
          new = '''def _test_inventory() -> Dict[str, Any]:
              tests_root = BACKEND_ROOT / "tests"
              backend_tests = sorted(
                  {
                      p.relative_to(tests_root).as_posix()
                      for pattern in ("test_*.py", "*_test.py")
                      for p in tests_root.rglob(pattern)
                  }
              )
              mobile_tests = sorted(p.name for p in (MOBILE_ROOT / "tests").glob("*.test.ts"))
              return {
                  "backend_test_files": len(backend_tests),
                  "mobile_test_files": len(mobile_tests),
                  "backend_test_names": backend_tests,
                  "mobile_test_names": mobile_tests,
              }
          '''
          if old not in text:
              raise SystemExit('expected rglob inventory block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate deterministic artifacts
        run: |
          PYTHONPATH=backend python scripts/render_system_truth.py
          PYTHONPATH=backend python scripts/render_verification_report.py
      - name: Commit repair and generated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/victor_ai_bot/system_truth.py docs/generated/system_truth.json docs/generated/system_truth.md docs/generated/verification_report.json docs/generated/verification_report.md
          git diff --cached --check
          git commit -m 'fix: preserve duplicate test paths in system truth inventory'
          git push origin HEAD:${{ github.ref_name }}
