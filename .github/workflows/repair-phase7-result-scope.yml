name: Repair Phase 7 result scope

on:
  push:
    branches: [omar/phase-7-operator-intent]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'ci: repair phase7 result scope')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename execution result scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/victor_ai_bot/runtime_services/withdraw_all_service.py')
          s = p.read_text(encoding='utf-8')
          marker = '        items = list(plan.get("items") or [])\n'
          start = s.index(marker)
          end = s.index('\n    async def ', start)
          block = s[start:end]
          if '        result = {' not in block:
              raise SystemExit('execution result block not found')
          block = block.replace('result', 'execute_result')
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install black==24.10.0
      - run: black backend/victor_ai_bot/runtime_services/withdraw_all_service.py && black --check backend
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git diff --cached --check
          git commit -m 'ci: repair phase7 result scope'
          git push origin HEAD:omar/phase-7-operator-intent
