name: Repair Phase 7 result scope

on:
  push:
    branches: [omar/phase-7-operator-intent]

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'ci: repair phase7 result scope')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename execution result scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/victor_ai_bot/runtime_services/withdraw_all_service.py')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          start = 1415 - 1
          if len(lines) < start + 1:
              raise SystemExit('withdraw_all_service.py is shorter than expected')
          for i in range(start, len(lines)):
              lines[i] = lines[i].replace('execute_result', 'result')
              lines[i] = lines[i].replace('result', 'execute_result')
          p.write_text(''.join(lines), encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install black==24.10.0
      - run: black backend/victor_ai_bot/runtime_services/withdraw_all_service.py && black --check backend
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git diff --cached --check
          git commit -m 'ci: repair phase7 result scope'
          git push origin HEAD:omar/phase-7-operator-intent
