name: One-off generated truth refresh

on:
  push:
    branches:
      - mobile/stale-realtime-reconciliation

permissions:
  contents: write

jobs:
  refresh-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Regenerate canonical truth artifacts
        run: |
          PYTHONPATH=backend python scripts/render_system_truth.py
          PYTHONPATH=backend python scripts/render_verification_report.py
      - name: Remove one-off workflow and commit generated artifacts
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          rm .github/workflows/_oneoff_refresh_generated_truth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/system_truth.json docs/generated/verification_report.json .github/workflows/_oneoff_refresh_generated_truth.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh generated truth artifacts"
          git push origin "HEAD:${BRANCH}"
