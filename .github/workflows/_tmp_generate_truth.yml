name: _tmp-generate-truth
on:
  push:
    branches:
      - codex/phase-b4-execution-integration
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Generate canonical truth
        env:
          PYTHONPATH: backend
        run: |
          python scripts/render_system_truth.py
          python scripts/render_verification_report.py
      - name: Upload generated truth
        uses: actions/upload-artifact@v4
        with:
          name: tmp-generated-truth
          path: |
            docs/generated/system_truth.json
            docs/generated/system_truth.md
            docs/generated/verification_report.json
            docs/generated/verification_report.md
