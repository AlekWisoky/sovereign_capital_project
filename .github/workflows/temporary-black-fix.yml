name: Temporary Black Fix

on:
  push:
    branches:
      - omar/phase-6-runtime-method-chain

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Black
        run: pip install black==24.10.0
      - name: Format backend
        run: black backend
      - name: Commit formatted backend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git add backend
          git commit -m 'style: format backend with Black'
          git push origin HEAD:omar/phase-6-runtime-method-chain
