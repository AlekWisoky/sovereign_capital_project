name: withdraw-fix3
on:
  push:
    branches:
      - codex/phase-22-blackfix-run7
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/phase-22-blackfix-run7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Repair keyword calls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          s = p.read_text()
          s2 = s.replace("execute_result=", "result=")
          if s2 == s:
              raise SystemExit("expected execute_result keyword not found")
          p.write_text(s2)
          PY
          black backend/victor_ai_bot/runtime_services/withdraw_all_service.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git diff --cached --quiet && exit 0
          git commit -m "fix: correct withdraw outcome keyword typing"
          git push origin HEAD:codex/phase-22-blackfix-run7
