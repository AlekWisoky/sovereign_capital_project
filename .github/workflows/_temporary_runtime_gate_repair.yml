name: Temporary Runtime Gate Repair

on:
  push:
    branches:
      - codex/black-format-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Apply deterministic runtime fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          wrapper = Path("backend/victor_ai_bot/runtime_services/runtime_execute_wrapper_facade.py")
          text = wrapper.read_text()
          old = "res = self._propagate_decision_economics(res, decision, opp)"
          new = "res = RuntimeExecuteWrapperFacade._propagate_decision_economics(res, decision, opp)"
          if old not in text:
              raise SystemExit("runtime wrapper replacement target not found")
          wrapper.write_text(text.replace(old, new, 1))

          trainer = Path("backend/victor_ai_bot/omar/trainer.py")
          text = trainer.read_text()
          marker = '        context = getattr(outcome, "context", {}) or {}\n'
          insertion = marker + '        brain = context.get("brain") if isinstance(context, dict) else {}\n'
          if insertion not in text:
              if marker not in text:
                  raise SystemExit("trainer context marker not found")
              text = text.replace(marker, insertion, 1)
          trainer.write_text(text)
          PY
      - name: Format backend
        run: black backend
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git commit -m "fix: repair runtime gate and format canonical lifecycle"
          git push