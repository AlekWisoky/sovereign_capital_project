name: Temporary pytest diagnostic
on:
  push:
    branches:
      - omar/phase-7-production-shaped-lineage
permissions:
  contents: read
jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements-dev.txt -r backend/requirements.txt pytest-timeout==2.3.1
      - name: Run pytest with per-test timeout and capture full log
        shell: bash
        run: |
          set +e
          cd backend
          python -m pytest -q --timeout=120 --timeout-method=thread > ../pytest.log 2>&1
          status=$?
          echo "pytest_exit=$status" >> ../pytest.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-timeout-diagnostic
          path: pytest.log
