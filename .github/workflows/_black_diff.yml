name: Temporary Black diff
on:
  push:
    branches:
      - omar/phase-7-production-shaped-lineage
permissions:
  contents: read
jobs:
  black-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black==24.10.0
      - run: black --diff backend/victor_ai_bot/decision_identity.py
