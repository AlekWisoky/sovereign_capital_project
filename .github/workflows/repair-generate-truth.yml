name: repair-generate-truth

on:
  push:
    branches:
      - repair/strict-settlement-usd-economics

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/strict-settlement-usd-economics
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Regenerate repository truth artifacts
        run: |
          PYTHONPATH=backend python scripts/render_system_truth.py
          PYTHONPATH=backend python scripts/render_verification_report.py
      - name: Commit regenerated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/system_truth.json docs/generated/system_truth.md docs/generated/verification_report.json docs/generated/verification_report.md docs/SMOOTH_RUN_REVIEW.md
          if git diff --cached --quiet; then
            echo 'No generated artifact changes.'
            exit 0
          fi
          git commit -m 'chore: refresh generated repository truth'
          git push origin HEAD:repair/strict-settlement-usd-economics
