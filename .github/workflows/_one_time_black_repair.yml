name: One-time Black repair

on:
  push:
    branches:
      - codex/current-main-omar-capital-lineage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Black
        run: python -m pip install --disable-pip-version-check black==24.10.0
      - name: Format current decision facade
        run: black backend/victor_ai_bot/runtime_services/runtime_decision_finalize_facade.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/victor_ai_bot/runtime_services/runtime_decision_finalize_facade.py
          git commit -m 'style: format decision finalization facade'
          git push
