name: Temporary PR60 Black Format

on:
  push:
    branches:
      - codex/omar-canonical-capital-lineage

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Format the two CI-blocking files
        run: black backend/victor_ai_bot/omar/runtime.py backend/victor_ai_bot/decision_engine.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/omar/runtime.py backend/victor_ai_bot/decision_engine.py
          if git diff --cached --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git commit -m "style: format PR60 CI-blocking files"
          git push
