name: One-shot repair 2

on:
  push:
    branches:
      - omar/phase-7-canonical-execution-invariant

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'ci: repair execute-result keyword')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair keyword arguments
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          text = path.read_text(encoding="utf-8")
          changed = text.replace("execute_result=execute_result", "result=execute_result")
          if changed == text:
              raise SystemExit("expected execute_result keyword arguments not found")
          path.write_text(changed, encoding="utf-8")
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py .github/workflows/one-shot-repair-2.yml
          git diff --cached --check
          git commit -m "ci: repair execute-result keyword"
          git push origin HEAD:omar/phase-7-canonical-execution-invariant
