name: One-time verification truth refresh

on:
  push:
    branches:
      - fix/runtime-facade-mro-shadowing

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Regenerate canonical verification truth
        run: PYTHONPATH=backend python scripts/render_verification_report.py
      - name: Commit generated truth only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/verification_report.json docs/generated/verification_report.md docs/SMOOTH_RUN_REVIEW.md
          if git diff --cached --quiet; then
            echo "Generated verification truth already current."
            exit 0
          fi
          git commit -m "chore: refresh generated verification truth"
          git push
