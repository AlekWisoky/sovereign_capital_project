name: Temporary Black Format

on:
  push:
    branches:
      - omar/phase-8-physical-settlement-lineage

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Format Phase 8 files
        run: |
          black backend/victor_ai_bot/omar/lifecycle_bridge.py backend/victor_ai_bot/omar/production_lineage_bridge.py backend/victor_ai_bot/omar/real_learning.py backend/victor_ai_bot/omar/runtime.py backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py backend/victor_ai_bot/runtime_services/runtime_decision_facade.py
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: phase-8-black-formatted
          path: |
            backend/victor_ai_bot/omar/lifecycle_bridge.py
            backend/victor_ai_bot/omar/production_lineage_bridge.py
            backend/victor_ai_bot/omar/real_learning.py
            backend/victor_ai_bot/omar/runtime.py
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py
