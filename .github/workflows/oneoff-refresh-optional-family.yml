name: One-off refresh optional family truth

on:
  push:
    branches:
      - codex/issue-95-alpha-marketplace

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Regenerate deterministic artifacts
        run: |
          PYTHONPATH=backend python scripts/render_optional_family_status.py
      - name: Commit regenerated artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/generated/optional_family_status.json docs/generated/optional_family_status.md
          if git diff --cached --quiet; then
            echo 'No generated optional-family changes.'
            exit 0
          fi
          git commit -m 'chore: refresh optional family truth'
          git push
