name: Phase 6 Black formatter

on:
  push:
    branches:
      - omar/phase-6-runtime-method-chain

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: omar/phase-6-runtime-method-chain
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: python -m pip install black==24.10.0

      - name: Format Phase 6 files
        run: |
          black \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py

      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase6-black-fix.yml
          git add \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(phase6): format canonical runtime integration"
          git push origin HEAD:omar/phase-6-runtime-method-chain
