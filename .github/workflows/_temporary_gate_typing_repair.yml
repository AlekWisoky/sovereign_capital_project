name: Temporary Gate Typing Repair

on:
  push:
    branches:
      - codex/black-format-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Repair typing seams
        run: |
          python - <<'PY'
          from pathlib import Path

          w = Path("backend/victor_ai_bot/runtime_services/runtime_execute_wrapper_facade.py")
          text = w.read_text()
          old = '''            if isinstance(getattr(opp, "meta", None), dict):\n                brain = opp.meta.setdefault("brain", {})\n                if isinstance(brain, dict):\n                    brain["economic_context"] = dict(economic)\n                opp.meta["decision_economic_context"] = dict(economic)\n'''
          new = '''            opp_meta = getattr(opp, "meta", None)\n            if isinstance(opp_meta, dict):\n                brain = opp_meta.setdefault("brain", {})\n                if isinstance(brain, dict):\n                    brain["economic_context"] = dict(economic)\n                opp_meta["decision_economic_context"] = dict(economic)\n'''
          if old not in text:
              raise SystemExit("execution wrapper meta seam not found")
          w.write_text(text.replace(old, new, 1))

          p = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          text = p.read_text()
          old = '''        persisted_state = dict(state)\n        preview_id = str(raw_payload.get("preview_id") or "")\n'''
          new = '''        persisted_state = dict(state)\n        result: Dict[str, Any] = {}\n        preview_id = str(raw_payload.get("preview_id") or "")\n'''
          if old not in text:
              raise SystemExit("withdraw result initialization point not found")
          text = text.replace(old, new, 1)
          old = '        result: Dict[str, Any] = {\n            "ok": True,\n'
          new = '        result = {\n            "ok": True,\n'
          if old not in text:
              raise SystemExit("withdraw final result annotation not found")
          text = text.replace(old, new, 1)
          old = '''        chain = str(\n            getattr(getattr(runtime, "cfg", None), "chain", None).name\n            if getattr(getattr(runtime, "cfg", None), "chain", None) is not None\n            else "default"\n        )\n'''
          new = '''        chain_cfg = getattr(getattr(runtime, "cfg", None), "chain", None)\n        chain = str(getattr(chain_cfg, "name", "default") or "default")\n'''
          if old not in text:
              raise SystemExit("withdraw chain typing seam not found")
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Format backend
        run: black backend
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: clear canonical gate typing seams"
          git push