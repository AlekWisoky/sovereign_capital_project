name: Format OMAR Phase 6

on:
  push:
    branches:
      - omar/phase-6-runtime-method-chain

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: pip install black==24.10.0

      - name: Format OMAR Phase 6 files
        run: |
          black \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py

      - name: Commit formatting repair
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py
          git commit -m "style: format OMAR phase 6 integration files"
          git push origin HEAD:${{ github.ref_name }}
