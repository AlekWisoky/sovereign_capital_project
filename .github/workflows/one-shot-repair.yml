name: One-shot repair

on:
  push:
    branches:
      - omar/phase-7-canonical-execution-invariant

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, 'ci: apply targeted repair')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: pip install black==24.10.0

      - name: Apply targeted repair and canonical formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import tokenize
          from io import StringIO

          path = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          text = path.read_text(encoding="utf-8")

          old_chain = '''        chain = str(\n            getattr(getattr(runtime, "cfg", None), "chain", None).name\n            if getattr(getattr(runtime, "cfg", None), "chain", None) is not None\n            else "default"\n        )'''
          new_chain = '''        chain_cfg = getattr(getattr(runtime, "cfg", None), "chain", None)\n        chain = str(getattr(chain_cfg, "name", "default") or "default")'''
          if old_chain in text:
              text = text.replace(old_chain, new_chain, 1)
          elif new_chain not in text:
              raise SystemExit("expected chain expression not found")

          start_marker = '        result: Dict[str, Any] = {\n            "ok": True,\n            "status": state["last_status"],'
          start = text.find(start_marker)
          if start < 0:
              if '        execute_result: Dict[str, Any] = {\n            "ok": True,\n            "status": state["last_status"],' not in text:
                  raise SystemExit("expected execution result block not found")
          else:
              end = text.find('        controls = getattr(getattr(runtime, "_cc", None), "controls", None)', start)
              if end < 0:
                  raise SystemExit("expected execution block terminator not found")
              segment = text[start:end]
              tokens = list(tokenize.generate_tokens(StringIO(segment).readline))
              out = []
              for tok in tokens:
                  if tok.type == tokenize.NAME and tok.string == "result":
                      tok = tok._replace(string="execute_result")
                  out.append(tok)
              segment = tokenize.untokenize(out)
              text = text[:start] + segment + text[end:]

          path.write_text(text, encoding="utf-8")
          PY

          black backend
          git diff --check

      - name: Commit repaired sources and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py \
            backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py \
            .github/workflows/one-shot-repair.yml
          git diff --cached --check
          git commit -m "ci: apply targeted repair"
          git push origin HEAD:omar/phase-7-canonical-execution-invariant
