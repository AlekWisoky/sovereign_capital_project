name: Temporary Withdraw Final Typing Fix

on:
  push:
    branches:
      - omar/phase-6-runtime-method-chain

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct final result names
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    async def execute(self, runtime: Any, payload: Dict[str, Any]) -> Dict[str, Any]:")
          segment = text[start:]
          segment = segment.replace("execute_execute_result", "execute_result")
          segment = segment.replace("replayed_execute_result", "replayed_result")
          segment = segment.replace("        execute_result: Dict[str, Any] = {", "        execute_result = {")
          marker = '        if not preview_id or preview_id != str(state.get("last_preview_id") or ""):\n            execute_result = {'
          replacement = '        execute_result: Dict[str, Any] = {}\n        if not preview_id or preview_id != str(state.get("last_preview_id") or ""):\n            execute_result = {'
          if marker not in segment:
              raise SystemExit("first execute_result declaration marker not found")
          segment = segment.replace(marker, replacement, 1)
          text = text[:start] + segment
          path.write_text(text, encoding="utf-8")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format
        run: python -m pip install black==24.10.0 && black backend/victor_ai_bot/runtime_services/withdraw_all_service.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git commit -m "fix: correct final withdraw result names"
          git push
