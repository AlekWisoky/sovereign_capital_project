name: Temporary Phase7 Mypy Repair

on:
  push:
    branches:
      - omar/phase-7-human-control-contract

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: omar/phase-7-human-control-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Apply targeted typing repairs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          s = p.read_text(encoding="utf-8")
          s = s.replace("from typing import Any, Dict, List\n", "from typing import Any, Dict, List, cast\n", 1)
          s = s.replace('''        chain = str(\n            getattr(getattr(runtime, "cfg", None), "chain", None).name\n            if getattr(getattr(runtime, "cfg", None), "chain", None) is not None\n            else "default"\n        )\n''', '''        chain_cfg = getattr(getattr(runtime, "cfg", None), "chain", None)\n        chain = str(getattr(chain_cfg, "name", "default") or "default")\n''', 1)
          s = s.replace('''            result = {"ok": False, "reason_code": "preview_id_mismatch"}\n''', '''            result: Dict[str, Any] = {"ok": False, "reason_code": "preview_id_mismatch"}\n''', 1)
          s = s.replace('''        items = list(plan.get("items") or [])\n''', '''        items = cast(List[Dict[str, Any]], plan.get("items") or [])\n''', 1)
          s = s.replace('''        result: Dict[str, Any] = {\n            "ok": True,\n''', '''        result = {\n            "ok": True,\n''', 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Validate targeted mypy
        run: |
          black backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          while read -r slice; do mypy @"$slice"; done < backend/mypy_targets.txt
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(types): repair withdraw service mypy contract"
          git push origin HEAD:omar/phase-7-human-control-contract
