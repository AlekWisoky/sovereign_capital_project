name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Python compile check
        run: python -m compileall -q backend
      - name: Mypy OMAR integration
        run: mypy $(tr '\n' ' ' < backend/mypy_omar_targets.txt)

  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Collect and assign test files
        working-directory: backend
        run: |
          pytest --collect-only -q > /tmp/pytest-collection.txt 2>&1 || { cat /tmp/pytest-collection.txt; exit 1; }
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          files = Counter()
          for raw in Path('/tmp/pytest-collection.txt').read_text().splitlines():
              nodeid = raw.strip()
              if '::' not in nodeid or not nodeid.startswith('tests/'):
                  continue
              path = nodeid.split('::', 1)[0]
              if path.endswith('.py'):
                  files[path] += 1
          if not files:
              raise SystemExit('pytest collection produced no test nodeids')
          shards = [[] for _ in range(8)]
          counts = [0] * 8
          for path, count in sorted(files.items(), key=lambda x: x[1], reverse=True):
              i = min(range(8), key=counts.__getitem__)
              shards[i].append(path); counts[i] += count
          shard = int('${{ matrix.shard }}')
          Path(f'/tmp/shard-{shard}.txt').write_text('\n'.join(shards[shard]) + '\n')
          print(f'shard={shard} tests={counts[shard]} files={len(shards[shard])}')
          PY
      - name: Run pytest shard
        working-directory: backend
        run: |
          mapfile -t files < /tmp/shard-${{ matrix.shard }}.txt
          test "${#files[@]}" -gt 0
          pytest -q -o faulthandler_timeout=300 "${files[@]}"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd mobile
          npm install --no-audit --no-fund
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: |
          cd contracts
          forge test -q
