name: CI

on:
  push:
  pull_request:

jobs:
  canonical-runtime-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
          pip install pytest-asyncio

      - name: Canonical runtime execution-path tests
        run: |
          cd backend
          pytest -q \
            tests/test_runtime_production_execution_path.py \
            tests/test_execution_service_auto_trade_hold.py \
            tests/test_canonical_identity_outcome_lineage.py \
            tests/test_omar_runtime.py \
            tests/test_omar_net_profit_latency_learning.py

  execution-facade-typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Focused execution facade typing
        run: |
          mypy \
            backend/victor_ai_bot/runtime_services/runtime_execute_dispatch_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_execute_entry_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_execute_wrapper_facade.py \
            backend/victor_ai_bot/runtime_services/execution_service.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
          pip install pytest-asyncio

      - name: Ruff
        run: |
          ruff check backend
          while read -r slice; do
            xargs -a "$slice" ruff check
          done < backend/mypy_targets.txt

      - name: Black
        run: |
          black --check backend
          while read -r slice; do
            xargs -a "$slice" black --check
          done < backend/mypy_targets.txt

      - name: Mypy (expanded typed slices)
        run: |
          while read -r slice; do
            mypy @"$slice"
          done < backend/mypy_targets.txt

      - name: Focused canonical lifecycle tests
        run: |
          cd backend
          pytest -q \
            tests/test_runtime_production_execution_path.py \
            tests/test_execution_service_auto_trade_hold.py \
            tests/test_canonical_identity_outcome_lineage.py \
            tests/test_omar_runtime.py \
            tests/test_omar_net_profit_latency_learning.py

      - name: Pytest
        run: |
          cd backend
          pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          cd mobile
          npm install --no-audit --no-fund

      - name: Mobile typecheck + unit smoke
        run: |
          cd mobile
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge tests
        run: |
          cd contracts
          forge test -q
