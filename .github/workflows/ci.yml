name: CI

on:
  push:
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: |
          ruff check backend
          while read -r slice; do
            xargs -a "$slice" ruff check
          done < backend/mypy_targets.txt

      - name: Black
        run: |
          black --check backend
          while read -r slice; do
            xargs -a "$slice" black --check
          done < backend/mypy_targets.txt

      - name: Mypy (expanded typed slices)
        run: |
          while read -r slice; do
            mypy @"$slice"
          done < backend/mypy_targets.txt

  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        total: [8]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Collect pytest nodeids
        working-directory: backend
        run: |
          pytest --collect-only -q > /tmp/pytest-nodeids.txt
          python - <<'PY'
          from pathlib import Path

          lines = [
              line.strip()
              for line in Path('/tmp/pytest-nodeids.txt').read_text(encoding='utf-8').splitlines()
              if '::' in line and line.strip()
          ]
          total = 8
          if not lines:
              print(Path('/tmp/pytest-nodeids.txt').read_text(encoding='utf-8'))
              raise SystemExit('pytest collection produced zero nodeids; refusing a false-green shard gate')
          for shard in range(total):
              selected = lines[shard::total]
              Path(f'/tmp/pytest-shard-{shard}.txt').write_text(
                  '\n'.join(selected) + ('\n' if selected else ''), encoding='utf-8'
              )
          shard = int("${{ matrix.shard }}")
          print(f'collected={len(lines)}')
          print(f'shard={shard} size={len(lines[shard::total])}')
          PY

      - name: Run pytest shard
        working-directory: backend
        run: |
          mapfile -t tests < /tmp/pytest-shard-${{ matrix.shard }}.txt
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No tests assigned to shard ${{ matrix.shard }}"
            exit 0
          fi
          pytest -q -o faulthandler_timeout=300 "${tests[@]}"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          cd mobile
          npm install --no-audit --no-fund

      - name: Mobile typecheck + unit smoke
        run: |
          cd mobile
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge tests
        run: |
          cd contracts
          forge test -q
