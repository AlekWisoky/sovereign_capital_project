name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Python compile check
        run: python -m compileall -q backend
      - name: Mypy OMAR integration
        run: mypy $(tr '\n' ' ' < backend/mypy_omar_targets.txt)

  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Collect and assign test files
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = sorted({
              *Path('tests').rglob('test_*.py'),
              *Path('tests').rglob('*_test.py'),
          })
          if not tests:
              raise SystemExit('no pytest files found under backend/tests')

          # Shard the complete discovered test-file set deterministically.
          # Pytest remains authoritative for collection and execution errors.
          shards = [[] for _ in range(8)]
          for index, path in enumerate(tests):
              shards[index % 8].append(path.as_posix())

          shard = int('${{ matrix.shard }}')
          selected = shards[shard]
          Path(f'/tmp/shard-{shard}.txt').write_text('\n'.join(selected) + '\n')
          print(f'shard={shard} files={len(selected)} total_files={len(tests)}')
          PY
      - name: Run pytest shard
        working-directory: backend
        run: |
          mapfile -t files < /tmp/shard-${{ matrix.shard }}.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files assigned to shard ${{ matrix.shard }}; treating empty shard as success."
            exit 0
          fi
          pytest -q -o faulthandler_timeout=300 "${files[@]}"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd mobile
          npm install --no-audit --no-fund
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: |
          cd contracts
          forge test -q
