name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: sovereign-capital-ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend
      - name: Python compile check
        run: python -m compileall -q backend
      - name: Mypy OMAR integration
        run: mypy $(tr '\n' ' ' < backend/mypy_omar_targets.txt)

  optional-family-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Generate status artifacts outside the working tree
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, 'backend')
          from victor_ai_bot.optional_family_status import build_optional_family_status, render_optional_family_status_markdown
          from victor_ai_bot.verification_report import build_verification_report
          payload = build_optional_family_status()
          report = build_verification_report()
          out = Path('/tmp/optional-family-status')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'optional_family_status.json').write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          (out / 'optional_family_status.md').write_text(render_optional_family_status_markdown(payload))
          (out / 'verification_report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY
          python scripts/render_system_truth.py > /tmp/optional-family-status/system_truth_generation.json
          cp docs/generated/system_truth.json /tmp/optional-family-status/system_truth.json
      - uses: actions/upload-artifact@v4
        with:
          name: optional-family-status-${{ github.sha }}
          path: /tmp/optional-family-status

  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Collect and assign test files
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path
          tests = sorted({*Path('tests').rglob('test_*.py'), *Path('tests').rglob('*_test.py')})
          if not tests:
              raise SystemExit('no pytest files found under backend/tests')
          shards = [[] for _ in range(8)]
          for index, path in enumerate(tests):
              shards[index % 8].append(path.as_posix())
          shard = int('${{ matrix.shard }}')
          selected = shards[shard]
          Path(f'/tmp/shard-{shard}.txt').write_text('\n'.join(selected) + '\n')
          print(f'shard={shard} files={len(selected)} total_files={len(tests)}')
          PY
      - name: Run pytest shard
        working-directory: backend
        run: |
          mapfile -t files < /tmp/shard-${{ matrix.shard }}.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No files assigned to shard ${{ matrix.shard }}; treating empty shard as success."
            exit 0
          fi
          pytest -vv -o faulthandler_timeout=60 "${files[@]}"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd mobile
          npm install --no-audit --no-fund
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: |
          cd contracts
          forge test -q

  issue94-prime-repair-verify:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'tmp-issue94-prime-repair-20260913'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply the deterministic repair script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/prime-repair-20260913-v2.yml').read_text()
          start = workflow.index("          python - <<'PY'" + chr(10)) + len("          python - <<'PY'" + chr(10))
          end = workflow.index(chr(10) + "          PY", start)
          Path('/tmp/prime_repair.py').write_text(textwrap.dedent(workflow[start:end]))
          PY
          python /tmp/prime_repair.py
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Focused Prime regression suite
        working-directory: backend
        run: |
          ruff check victor_ai_bot/internal_prime/allocator.py tests/test_internal_prime_system.py
          python -m compileall -q victor_ai_bot/internal_prime/allocator.py tests/test_internal_prime_system.py
          pytest -q tests/test_internal_prime_system.py
      - name: Commit verified repair
        run: |
          test "$GITHUB_HEAD_REF" = "tmp-issue94-prime-repair-20260913"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/internal_prime/allocator.py backend/tests/test_internal_prime_system.py
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git diff --cached --check
          git commit -m "fix(issue94): require explicit Internal Prime capacity"
          git push origin HEAD:tmp-issue94-prime-repair-20260913
