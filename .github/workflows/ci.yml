name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: |
          ruff check backend
          while read -r slice; do
            xargs -a "$slice" ruff check
          done < backend/mypy_targets.txt

      - name: Black (diagnostic formatting pass)
        run: |
          black backend
          git diff --check
          git diff -- backend/victor_ai_bot/omar/production_lineage_bridge.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/runtime_services/canonical_settlement_interface.py \
            backend/victor_ai_bot/runtime_services/runtime_constructor_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_facade.py > /tmp/black.patch

      - name: Upload Black diagnostic patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: black-diagnostic-patch
          path: /tmp/black.patch
          if-no-files-found: error

      - name: Mypy (expanded typed slices)
        run: |
          while read -r slice; do
            mypy @"$slice"
          done < backend/mypy_targets.txt

      - name: Pytest
        run: |
          cd backend
          timeout --signal=TERM --kill-after=30s 30m python -m pytest -q --faulthandler-timeout=60 --durations=25

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          cd mobile
          npm install --no-audit --no-fund

      - name: Mobile typecheck + unit smoke
        run: |
          cd mobile
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge tests
        run: |
          cd contracts
          forge test -q
