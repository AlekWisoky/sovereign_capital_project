name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: |
          ruff check backend

      - name: Black
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin "$BASE_SHA" --depth=1
            mapfile -t files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'backend/**/*.py' 'backend/*.py')
          else
            mapfile -t files < <(git ls-files 'backend/**/*.py' 'backend/*.py')
          fi
          if [ "${#files[@]}" -gt 0 ]; then
            if ! black --check "${files[@]}"; then
              echo "Black formatting diff:"
              black --diff "${files[@]}"
              exit 1
            fi
          else
            echo "No backend Python files changed; Black gate has nothing to check."
          fi

      - name: Mypy (expanded typed slices)
        run: |
          while read -r slice; do
            mypy @"$slice"
          done < backend/mypy_targets.txt

      - name: Pytest
        run: |
          cd backend
          pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          cd mobile
          npm install --no-audit --no-fund

      - name: Mobile typecheck + unit smoke
        run: |
          cd mobile
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge tests
        run: |
          cd contracts
          forge test -q
