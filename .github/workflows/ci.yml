name: CI

on:
  push:
  pull_request:

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: |
          ruff check backend
          while read -r slice; do
            xargs -a "$slice" ruff check
          done < backend/mypy_targets.txt

      - name: Black
        run: |
          black --check backend
          while read -r slice; do
            xargs -a "$slice" black --check
          done < backend/mypy_targets.txt

      - name: Mypy (expanded typed slices)
        run: |
          while read -r slice; do
            mypy @"$slice"
          done < backend/mypy_targets.txt

  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
        total: [8]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Collect pytest files
        working-directory: backend
        run: |
          pytest --collect-only -q > /tmp/pytest-collection.txt
          python - <<'PY'
          from pathlib import Path
          import re

          files = []
          for raw in Path('/tmp/pytest-collection.txt').read_text(encoding='utf-8').splitlines():
              match = re.match(r'^(tests/[^:]+):\s+(\d+)\s*$', raw.strip())
              if match:
                  files.append((match.group(1), int(match.group(2))))
          total = 8
          if not files:
              print(Path('/tmp/pytest-collection.txt').read_text(encoding='utf-8'))
              raise SystemExit('pytest collection produced zero test files; refusing a false-green shard gate')
          shard_files = [[] for _ in range(total)]
          shard_counts = [0] * total
          # Greedy balancing by collected test count keeps large test modules from
          # concentrating on one runner while preserving whole-file execution.
          for path, count in sorted(files, key=lambda item: item[1], reverse=True):
              shard = min(range(total), key=lambda index: shard_counts[index])
              shard_files[shard].append(path)
              shard_counts[shard] += count
          for shard in range(total):
              Path(f'/tmp/pytest-shard-{shard}.txt').write_text(
                  '\n'.join(shard_files[shard]) + ('\n' if shard_files[shard] else ''),
                  encoding='utf-8',
              )
          shard = int("${{ matrix.shard }}")
          print(f'collected_files={len(files)}')
          print(f'collected_tests={sum(count for _, count in files)}')
          print(f'shard={shard} files={len(shard_files[shard])} tests={shard_counts[shard]}')
          PY

      - name: Run pytest shard
        working-directory: backend
        run: |
          mapfile -t test_files < /tmp/pytest-shard-${{ matrix.shard }}.txt
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No tests assigned to shard ${{ matrix.shard }}"
            exit 1
          fi
          pytest -q -o faulthandler_timeout=300 "${test_files[@]}"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          cd mobile
          npm install --no-audit --no-fund

      - name: Mobile typecheck + unit smoke
        run: |
          cd mobile
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge tests
        run: |
          cd contracts
          forge test -q
