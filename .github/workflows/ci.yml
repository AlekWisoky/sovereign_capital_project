name: CI

on:
  push:
  pull_request:

jobs:
  pr60_format:
    if: github.event_name == 'push' && github.ref_name == 'codex/omar-canonical-capital-lineage'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install formatting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Format PR60 canonical Python files
        run: |
          black \
            backend/victor_ai_bot/decision_identity.py \
            backend/victor_ai_bot/identity.py \
            backend/victor_ai_bot/learning/outcome_ledger.py \
            backend/victor_ai_bot/omar/goal_evidence.py \
            backend/victor_ai_bot/omar/integration.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/operator_intent.py \
            backend/victor_ai_bot/omar/policy.py \
            backend/victor_ai_bot/omar/production_learning_hook.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/settled_ledger_bridge.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/omar/trainer.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_finalize_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_execute_wrapper_facade.py \
            backend/victor_ai_bot/runtime_services/settled_outcome_lineage.py
      - name: Commit formatted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/victor_ai_bot/decision_identity.py \
            backend/victor_ai_bot/identity.py \
            backend/victor_ai_bot/learning/outcome_ledger.py \
            backend/victor_ai_bot/omar/goal_evidence.py \
            backend/victor_ai_bot/omar/integration.py \
            backend/victor_ai_bot/omar/lifecycle_bridge.py \
            backend/victor_ai_bot/omar/operator_intent.py \
            backend/victor_ai_bot/omar/policy.py \
            backend/victor_ai_bot/omar/production_learning_hook.py \
            backend/victor_ai_bot/omar/real_learning.py \
            backend/victor_ai_bot/omar/settled_ledger_bridge.py \
            backend/victor_ai_bot/omar/runtime.py \
            backend/victor_ai_bot/omar/trainer.py \
            backend/victor_ai_bot/runtime_services/runtime_decision_finalize_facade.py \
            backend/victor_ai_bot/runtime_services/runtime_execute_wrapper_facade.py \
            backend/victor_ai_bot/runtime_services/settled_outcome_lineage.py
          if git diff --cached --quiet; then
            echo "PR60 Python sources already Black-formatted"
            exit 0
          fi
          git commit -m "style: format PR60 canonical lineage sources"
          git push origin HEAD:codex/omar-canonical-capital-lineage

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: |
          ruff check backend
          while read -r slice; do
            xargs -a "$slice" ruff check
          done < backend/mypy_targets.txt

      - name: Black
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch origin "$BASE_SHA" --depth=1
            mapfile -t files < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'backend/**/*.py' 'backend/*.py')
          else
            mapfile -t files < <(git ls-files 'backend/**/*.py' 'backend/*.py')
          fi
          if [ "${#files[@]}" -gt 0 ]; then
            black --check "${files[@]}"
          else
            echo "No backend Python files changed; Black gate has nothing to check."
          fi

      - name: Mypy (expanded typed slices)
        run: |
          while read -r slice; do
            mypy @"$slice"
          done < backend/mypy_targets.txt

      - name: Pytest
        run: |
          cd backend
          pytest -q

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: |
          cd mobile
          npm install --no-audit --no-fund

      - name: Mobile typecheck + unit smoke
        run: |
          cd mobile
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge tests
        run: |
          cd contracts
          forge test -q
