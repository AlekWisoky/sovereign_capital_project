name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Ruff
        run: |
          ruff check backend
          while read -r slice; do xargs -a "$slice" ruff check; done < backend/mypy_targets.txt
      - name: Black
        run: |
          black --check backend
          while read -r slice; do xargs -a "$slice" black --check; done < backend/mypy_targets.txt
      - name: Mypy
        run: |
          while read -r slice; do mypy @"$slice"; done < backend/mypy_targets.txt

  backend-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Collect and assign test files
        working-directory: backend
        run: |
          pytest --collect-only -q > /tmp/pytest-collection.txt
          python - <<'PY'
          from pathlib import Path
          import re
          files = []
          for raw in Path('/tmp/pytest-collection.txt').read_text().splitlines():
              m = re.match(r'^(tests/[^:]+):\s+(\d+)\s*$', raw.strip())
              if m:
                  files.append((m.group(1), int(m.group(2))))
          if not files:
              raise SystemExit('pytest collection produced no test files')
          shards = [[] for _ in range(8)]
          counts = [0] * 8
          for path, count in sorted(files, key=lambda x: x[1], reverse=True):
              i = min(range(8), key=counts.__getitem__)
              shards[i].append(path); counts[i] += count
          shard = int('${{ matrix.shard }}')
          Path(f'/tmp/shard-{shard}.txt').write_text('\n'.join(shards[shard]) + '\n')
          print(f'shard={shard} tests={counts[shard]} files={len(shards[shard])}')
          PY
      - name: Run pytest shard
        working-directory: backend
        run: |
          mapfile -t files < /tmp/shard-${{ matrix.shard }}.txt
          test "${#files[@]}" -gt 0
          pytest -q -o faulthandler_timeout=300 "${files[@]}"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd mobile
          npm install --no-audit --no-fund
          npm run ci:test

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: |
          cd contracts
          forge test -q
