name: TEMP refresh generated truth

on:
  push:
    branches:
      - feat/issue97-omar-progressive-decision-context

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -c backend/constraints.txt -r backend/requirements-dev.txt
      - name: Refresh generated repository truth
        run: |
          PYTHONPATH=backend python scripts/render_system_truth.py
          PYTHONPATH=backend python scripts/render_optional_family_status.py
          PYTHONPATH=backend python scripts/render_verification_report.py
      - name: Commit generated truth and remove temporary workflow
        run: |
          rm -f .github/workflows/_temp_refresh_generated_truth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated docs/SMOOTH_RUN_REVIEW.md .github/workflows/_temp_refresh_generated_truth.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh generated repository truth"
          git push origin HEAD:feat/issue97-omar-progressive-decision-context
