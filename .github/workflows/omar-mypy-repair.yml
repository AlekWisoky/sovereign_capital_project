name: OMAR mypy repair

on:
  push:
    branches:
      - omar/phase-21-production-execution-identity-verified

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: python -m pip install black==24.10.0
      - name: Apply narrow withdraw-all typing repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          text = path.read_text(encoding="utf-8")

          old_chain = '''        chain = str(\n            getattr(getattr(runtime, "cfg", None), "chain", None).name\n            if getattr(getattr(runtime, "cfg", None), "chain", None) is not None\n            else "default"\n        )'''
          new_chain = '''        chain_cfg = getattr(getattr(runtime, "cfg", None), "chain", None)\n        chain = str(getattr(chain_cfg, "name", "default") or "default")'''
          if old_chain in text:
              text = text.replace(old_chain, new_chain, 1)

          marker = '        items = list(plan.get("items") or [])\n'
          if marker not in text:
              raise SystemExit("typing repair marker not found")
          before, after = text.split(marker, 1)
          after = re.sub(r"\\bresult\\b", "execute_result", after)
          text = before + marker + after
          path.write_text(text, encoding="utf-8")
          PY
          black backend/victor_ai_bot/runtime_services/withdraw_all_service.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          if git diff --cached --quiet; then
            echo "No repair changes"
            exit 0
          fi
          git commit -m "fix(typing): narrow withdraw-all execution result scope"
          git push
