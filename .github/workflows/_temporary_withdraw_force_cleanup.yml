name: Temporary Withdraw Force Cleanup

on:
  push:
    branches:
      - omar/phase-6-runtime-method-chain

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize execute result declaration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path("backend/victor_ai_bot/runtime_services/withdraw_all_service.py")
          text = path.read_text(encoding="utf-8")
          pattern = r'(?:        execute_result = \{\}\n)+        execute_result: Dict\[str, Any\] = \{\}'
          text, count = re.subn(pattern, '        execute_result: Dict[str, Any] = {}', text, count=1)
          if count != 1:
              raise SystemExit(f"duplicate execute declaration block not found: {count}")
          path.write_text(text, encoding="utf-8")
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Format and force push
        run: |
          python -m pip install black==24.10.0
          black backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/victor_ai_bot/runtime_services/withdraw_all_service.py
          git commit -m "fix: normalize withdraw execute result declaration" || exit 0
          git push --force origin HEAD:omar/phase-6-runtime-method-chain
