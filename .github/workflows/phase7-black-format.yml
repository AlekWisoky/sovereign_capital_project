name: Phase 7 Black formatting

on:
  push:
    branches:
      - omar/phase-7-reconciled-production-final-2-hook

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Black
        run: pip install black==24.10.0
      - name: Format backend
        run: black backend
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Backend already Black-clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          git commit -m "style(omar): normalize Phase 7 backend formatting"
          git push
