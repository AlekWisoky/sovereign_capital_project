[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = """
(
  ^/backend/tests/
 |^/backend/scripts/
 |^/backend/victor_ai_bot/(agents|alpha_marketplace|alpha_platform|analytics|aqe|backtest|behaveagent|caq_kds|cross_chain|funding_arb|liquidations|llm_inl|market_making|mev|research_pipeline|simulator|stat_arb|superstructure)/
 |^/backend/victor_ai_bot/fioa/(audit|runtime)\\.py
 |^/backend/victor_ai_bot/abi_utils.py
)
"""

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend"]
extend-exclude = ["backend/tests","backend/scripts","backend/victor_ai_bot/agents","backend/victor_ai_bot/alpha_marketplace","backend/victor_ai_bot/alpha_platform","backend/victor_ai_bot/analytics","backend/victor_ai_bot/aqe","backend/victor_ai_bot/backtest","backend/victor_ai_bot/behaveagent","backend/victor_ai_bot/caq_kds","backend/victor_ai_bot/cross_chain","backend/victor_ai_bot/fioa/audit.py","backend/victor_ai_bot/fioa/runtime.py","backend/victor_ai_bot/funding_arb","backend/victor_ai_bot/liquidations","backend/victor_ai_bot/llm_inl","backend/victor_ai_bot/market_making","backend/victor_ai_bot/mev","backend/victor_ai_bot/research_pipeline","backend/victor_ai_bot/simulator","backend/victor_ai_bot/stat_arb","backend/victor_ai_bot/superstructure","backend/victor_ai_bot/abi_utils.py"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B"]
ignore = ["E501", "E402", "E401", "E701", "E702", "I001", "B008", "F401", "B904", "B009", "B010", "B012", "B023", "B905", "E741", "F811", "F821", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_ignores = false
no_implicit_optional = false
follow_imports = "skip"


[tool.static_analysis_coverage]
slices = [
  "backend/mypy_targets/base_api_runtime.txt",
  "backend/mypy_targets/core_trading_capital.txt",
