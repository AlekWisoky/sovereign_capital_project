services:
  victor-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../../env/backend.env
    environment:
      VICTOR_CONFIG: /app/backend/config/ethereum.yaml
      VICTOR_MULTI_CONFIGS: /app/backend/config/ethereum.yaml,/app/backend/config/base.yaml,/app/backend/config/arbitrum.yaml
      VICTOR_MULTI_MAX_CHAINS: "3"
      VICTOR_MULTI_ALLOW_AUTO_ALL: "0"
      VICTOR_LOG_JSON: "1"
      VICTOR_AUTOSTART: "1"
      VICTOR_DEPLOYMENT_MODE: private
    volumes:
      - ../backend/config:/app/backend/config:ro
      - ../../backend-data:/app/backend/data
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file:
      - ../../env/caddy.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - victor-backend

volumes:
  caddy_data:
  caddy_config:
